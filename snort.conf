#############################################
# Minimal snort.conf for Windows (Snort 2.x)
# Path: C:\Snort\etc\snort.conf
#############################################

#############################################
# 1) Paths (Windows)
#############################################
var RULE_PATH C:\Snort\rules
var LOG_PATH  C:\Snort\log
config logdir: C:\Snort\log

# Dynamic modules (these two paths must exist on a standard Windows install)
dynamicpreprocessor directory C:\Snort\lib\snort_dynamicpreprocessor
dynamicengine C:\Snort\lib\snort_dynamicengine\sf_engine.dll

# Dynamic rules are optional; folder may not exist by default. Leave commented.
# dynamicdetection directory C:\Snort\lib\snort_dynamicrules


#############################################
# 2) Network variables (keep simple to start)
#############################################
var HOME_NET any
var EXTERNAL_NET any

# Common ports (only used by some rules; keep simple)
portvar HTTP_PORTS [80,8080,8000,443]
portvar SHELLCODE_PORTS !80
portvar ORACLE_PORTS 1521
portvar SSH_PORTS 22
portvar FTP_PORTS 21
portvar SIP_PORTS 5060
portvar FILE_DATA_PORTS [80,110,143,443,8080,20,21,1433,3306]
portvar GTP_PORTS 3386


#############################################
# 3) Preprocessors (very small, sane set)
#############################################
preprocessor frag3_global: max_frags 65536
preprocessor frag3_engine: policy first detect_anomalies

preprocessor stream5_global: track_tcp yes, track_udp no
preprocessor stream5_tcp: policy first, detect_anomalies, require_3whs 0

# Light HTTP normalization (safe defaults)
preprocessor http_inspect: global iis_unicode_map unicode.map 1252
preprocessor http_inspect_server: server default \
    http_methods { GET POST PUT SEARCH MKCOL COPY MOVE LOCK UNLOCK NOTIFY POLL BCOPY BDELETE BMOVE LINK UNLINK OPTIONS HEAD DELETE TRACE TRACK CONNECT SOURCE SUBSCRIBE UNSUBSCRIBE PROPFIND PROPPATCH BPROPFIND BPROPPATCH RPC_CONNECT PROXY_SUCCESS } \
    chunk_length 500000 \
    server_flow_depth 0 \
    client_flow_depth 0 \
    post_depth 0 \
    oversize_dir_length 500 

# Optional, simple portscan detector
preprocessor sfportscan: proto  { all } memcap { 10000000 } sense_level { low }


#############################################
# 4) Output (we’ll use console for tests)
#############################################
# Default logging goes to $LOG_PATH. For console alerts, start Snort with -A console.
output alert_fast: alert.fast


#############################################
# 5) Include your rules
#############################################
# Keep ONLY the local rules include while you’re learning.
include $RULE_PATH/local.rules

# Do NOT include community/snortruleset files until you’ve downloaded them.
# (Commented examples shown below for later)
# include $RULE_PATH/app-detect.rules
# include $RULE_PATH/attack-responses.rules
# include $RULE_PATH/bad-traffic.rules
